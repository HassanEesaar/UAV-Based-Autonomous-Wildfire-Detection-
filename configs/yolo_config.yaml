# YOLOv12n Wildfire Detection — Training Configuration

path: data/wildfire_dataset
train: images/train
val: images/val
test: images/test

nc: 2
names:
  0: smokes
  1: wildfire

# Training hyperparameters
epochs: 100
imgsz: 640
batch: 16
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
patience: 20
